# wiki/ を Quartz でビルドし、GitHub Pages にデプロイするワークフロー
#
# 仕様:
# - PoC 段階のため、手動実行（workflow_dispatch）のときだけ動かす。公開方針が固まったら push トリガーを追加する
# - ビルドと検証は site/build.sh に任せる（noindex の robots メタタグ挿入と site/verify.mjs による検証を含む）
# - 初回は リポジトリの Settings > Pages > Source を「GitHub Actions」にする必要がある
name: Deploy wiki site to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and verify site
        run: site/build.sh
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.quartz/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
