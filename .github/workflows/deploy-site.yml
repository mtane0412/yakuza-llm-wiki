# wiki/ を Quartz でビルドし、Cloudflare Workers Static Assets にデプロイするワークフロー
#
# 仕様:
# - main への push（wiki/・site/・本ファイルの変更時）と手動実行（workflow_dispatch）で動く
# - ビルドと検証は site/build.sh に任せる（noindex の robots メタタグ・_headers の配置と site/verify.mjs による検証を含む）
# - Quartz 本体とプラグイン（site/.quartz/）をキャッシュし、2 回目以降のビルド時間を短縮する。
#   キャッシュキーは site/build.sh のハッシュなので、QUARTZ_VERSION や応急処置を変えるとキャッシュも作り直される
# - デプロイには wrangler を使い、設定は site/wrangler.jsonc に置く
# - Cloudflare の API トークンを扱うため、アクションは可変タグではなくコミット SHA で固定する
#
# 必要な GitHub Secrets:
# - CLOUDFLARE_API_TOKEN: Cloudflare の API トークン（テンプレート「Edit Cloudflare Workers」で作成）
# - CLOUDFLARE_ACCOUNT_ID: Cloudflare のアカウント ID
name: Deploy wiki site to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "wiki/**"
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Cache Quartz and plugins
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            site/.quartz
            !site/.quartz/public
            !site/.quartz/content
          key: quartz-${{ runner.os }}-${{ hashFiles('site/build.sh') }}
      - name: Test verifier
        run: node --test site/verify.test.mjs
      - name: Build and verify site
        run: site/build.sh
      - name: Deploy to Cloudflare
        run: npx --yes wrangler@4.147.0 deploy --config site/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
